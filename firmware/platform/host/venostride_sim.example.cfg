# VenoStride simulator config. Copy to venostride_sim.cfg (ignored by git) and edit.
# Pass with: venostride_sim --config venostride_sim.cfg

# Four-digit clinician PIN.
pin = 0000

# Therapy current, clamped to 15-30 mA.
default_current_ma = 20

# Mode 3 frequency, clamped to 5-10 Hz.
mode3_frequency_hz = 7

# MPU6050 temperature compensation. These are identity values: no calibration
# exists yet. Fill them in from per-unit characterisation on real hardware.
imu_ref_temp_c = 25.0
imu_accel_offset_g = 0.0, 0.0, 0.0
imu_accel_bias_g_per_c = 0.0, 0.0, 0.0
imu_gyro_bias_dps_per_c = 0.0, 0.0, 0.0
